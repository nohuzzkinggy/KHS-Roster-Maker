<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roster Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg: #eef1ef;
    --surface: #ffffff;
    --surface-alt: #f4f6f5;
    --border: #dbe1de;
    --ink: #171f1d;
    --ink-muted: #57635f;
    --ink-faint: #90998f;
    --accent: #1f6f6b;
    --accent-strong: #14504c;
    --accent-soft: #dcece9;
    --accent-ink: #ffffff;
    --danger: #ac3a30;
    --danger-soft: #f5e2df;
    --shadow: rgba(15, 25, 22, 0.08);
    --shadow-strong: rgba(10, 18, 16, 0.28);
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101615;
      --surface: #182120;
      --surface-alt: #1c2625;
      --border: #2c3735;
      --ink: #e9efed;
      --ink-muted: #a9b6b1;
      --ink-faint: #6d7a76;
      --accent: #52b6ae;
      --accent-strong: #7bcac3;
      --accent-soft: rgba(82, 182, 174, 0.16);
      --accent-ink: #05201d;
      --danger: #e2897b;
      --danger-soft: rgba(226, 137, 123, 0.16);
      --shadow: rgba(0, 0, 0, 0.35);
      --shadow-strong: rgba(0, 0, 0, 0.55);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #101615;
    --surface: #182120;
    --surface-alt: #1c2625;
    --border: #2c3735;
    --ink: #e9efed;
    --ink-muted: #a9b6b1;
    --ink-faint: #6d7a76;
    --accent: #52b6ae;
    --accent-strong: #7bcac3;
    --accent-soft: rgba(82, 182, 174, 0.16);
    --accent-ink: #05201d;
    --danger: #e2897b;
    --danger-soft: rgba(226, 137, 123, 0.16);
    --shadow: rgba(0, 0, 0, 0.35);
    --shadow-strong: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 620px;
    margin: 0 auto;
    padding: clamp(28px, 8vw, 56px) 18px clamp(32px, 8vw, 60px);
  }

  header { margin-bottom: 22px; }

  header h1 {
    font-family: "Bebas Neue", "Archivo", sans-serif;
    font-weight: 400;
    font-size: clamp(34px, 10vw, 44px);
    letter-spacing: 0.03em;
    line-height: 1;
    margin: 0 0 10px;
    color: var(--ink);
  }

  header .rule {
    width: 46px;
    height: 4px;
    background: var(--accent);
    border-radius: 2px;
  }

  .btn {
    font-family: "Archivo", sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    padding: 10px 15px;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.05s ease, filter 0.15s ease, background 0.15s ease;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink-faint); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }

  /* ---------- card ---------- */

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: clamp(18px, 5vw, 26px) clamp(16px, 5vw, 26px) clamp(16px, 4vw, 22px);
    box-shadow: 0 1px 2px var(--shadow), 0 12px 28px var(--shadow);
  }

  .occasion-input {
    display: block;
    width: 100%;
    font-family: "Archivo", sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--ink);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 7px;
    padding: 6px 9px;
    margin: 0 0 2px -9px;
  }
  .occasion-input::placeholder { color: var(--ink-faint); font-weight: 700; }
  .occasion-input:hover { border-color: var(--border); background: var(--surface-alt); }
  .occasion-input:focus-visible {
    outline: none;
    border-color: var(--accent);
    background: var(--surface-alt);
  }

  .desc-input {
    display: block;
    width: 100%;
    font: inherit;
    font-size: 13.5px;
    color: var(--ink-muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 7px;
    padding: 7px 9px;
    margin: 0 0 18px -9px;
    resize: vertical;
    min-height: 20px;
    line-height: 1.5;
    font-family: inherit;
  }
  .desc-input::placeholder { color: var(--ink-faint); }
  .desc-input:hover { border-color: var(--border); background: var(--surface-alt); }
  .desc-input:focus-visible {
    outline: none;
    border-color: var(--accent);
    background: var(--surface-alt);
  }

  /* ---------- pool ---------- */

  .section-label {
    font-family: "Archivo", sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 8px;
  }

  .pool-zone {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    min-height: 44px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    background: var(--surface-alt);
  }
  .pool-zone.dragover { border-color: var(--accent); background: var(--accent-soft); }

  .add-person {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .add-person input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 13.5px;
    padding: 8px 10px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--ink);
  }
  .add-person input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---------- role zones ---------- */

  .roles-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
    margin: 18px 0 4px;
  }
  @media (max-width: 560px) {
    .roles-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .role-zone {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px;
    min-height: 104px;
    background: var(--surface-alt);
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .role-zone.dragover { border-color: var(--accent); background: var(--accent-soft); }

  .role-zone h3 {
    margin: 0;
    font-family: "Archivo", sans-serif;
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--accent-strong);
  }

  .role-empty {
    font-size: 11.5px;
    color: var(--ink-faint);
  }

  /* ---------- chips ---------- */

  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5px 7px 5px 5px;
    cursor: grab;
    user-select: none;
    touch-action: none;
  }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip.dragging { opacity: 0.3; }

  .chip .swatch {
    width: 19px;
    height: 19px;
    border-radius: 5px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Archivo", sans-serif;
    font-weight: 700;
    font-size: 9.5px;
    color: #fff;
  }

  .chip .name { font-size: 12.5px; font-weight: 600; }

  .chip .x {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 24px;
    min-height: 24px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 0;
    border-radius: 5px;
  }
  .chip .x:hover { background: var(--danger-soft); color: var(--danger); }

  .drag-ghost {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 60;
    opacity: 0.92;
  }

  .hint {
    font-size: 11.5px;
    color: var(--ink-faint);
    margin: 10px 0 0;
  }

  .card-bottom {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    padding-top: 16px;
    margin-top: 14px;
    border-top: 1px solid var(--border);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: var(--bg);
    font-size: 13px;
    font-weight: 500;
    padding: 10px 16px;
    border-radius: 8px;
    box-shadow: 0 10px 30px var(--shadow-strong);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    z-index: 50;
    max-width: 88vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 520px) {
    .add-person { flex-direction: column; }
    .add-person input,
    .desc-input {
      font-size: 16px; /* keeps iOS Safari from zooming in on focus */
    }
    .card-bottom .btn-primary {
      width: 100%;
      padding: 13px 15px;
    }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Roster Maker</h1>
    <div class="rule"></div>
  </header>

  <div class="card">
    <input type="text" class="occasion-input" id="occasionInput" placeholder="Occasion of assembly and date" maxlength="80">
    <textarea class="desc-input" id="descInput" rows="1" placeholder="Add a short description for the crew (optional)" maxlength="280"></textarea>

    <p class="section-label">People</p>
    <div class="pool-zone" id="poolZone" data-zone="pool"></div>
    <div class="add-person">
      <input type="text" id="newPersonName" placeholder="Add a name" maxlength="40" autocomplete="off">
      <button class="btn" id="addPersonBtn" type="button">Add</button>
    </div>
    <p class="hint">Drag a name into a role.</p>

    <div class="roles-grid" id="rolesGrid"></div>

    <div class="card-bottom">
      <button class="btn btn-primary" id="copyBtn" type="button">Copy roster</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  // ------------------------------------------------------------------
  // Fully static — no database. Everything lives in memory for this
  // page load only: the 14 names below are always here when the page
  // opens, but any adds/removes/moves reset the moment it's reloaded.
  // Build the roster, hit "Copy roster", paste it wherever it needs to go.
  // ------------------------------------------------------------------

  var ROLE_ZONES = [
    { key: "sound", label: "Sound" },
    { key: "lx", label: "Lx" },
    { key: "p", label: "P" },
    { key: "op", label: "Op" }
  ];

  var DEFAULT_PEOPLE = [
    { name: "Jay", color: "#8a4b2f" },
    { name: "Oliver", color: "#2f6a8f" },
    { name: "Ana", color: "#3f8f5c" },
    { name: "Caitlyn", color: "#6a4f9c" },
    { name: "Donte", color: "#1b8a8a" },
    { name: "Jacob", color: "#a4405f" },
    { name: "Lizzie", color: "#7a7a2f" },
    { name: "Jessica", color: "#55607a" },
    { name: "Charlie", color: "#8a4b2f" },
    { name: "Zara", color: "#2f6a8f" },
    { name: "Maddie", color: "#3f8f5c" },
    { name: "Jay G", color: "#6a4f9c" },
    { name: "Lauren", color: "#1b8a8a" },
    { name: "Jake", color: "#a4405f" },
    { name: "Danny", color: "#D9532B" }
    
  ];
  var SWATCHES = ["#8a4b2f", "#2f6a8f", "#3f8f5c", "#6a4f9c", "#1b8a8a", "#a4405f", "#7a7a2f", "#55607a"];

  var els = {
    occasionInput: document.getElementById("occasionInput"),
    descInput: document.getElementById("descInput"),
    poolZone: document.getElementById("poolZone"),
    newPersonName: document.getElementById("newPersonName"),
    addPersonBtn: document.getElementById("addPersonBtn"),
    rolesGrid: document.getElementById("rolesGrid"),
    copyBtn: document.getElementById("copyBtn"),
    toast: document.getElementById("toast")
  };

  var people = DEFAULT_PEOPLE.map(function (p, i) {
    return { id: "seed-" + i, name: p.name, color: p.color, assignment: "pool" };
  });
  var zoneEls = {}; // { sound: el, lx: el, p: el, op: el }
  var nextId = people.length;
  var toastTimer = null;

  /* ---------- helpers ---------- */

  function initials(name) {
    var parts = String(name || "?").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  function showToast(text) {
    els.toast.textContent = text;
    els.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { els.toast.classList.remove("show"); }, 2400);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { showToast("Copied — paste it into your message."); },
        function () { legacyCopy(text); }
      );
    } else {
      legacyCopy(text);
    }
  }

  function legacyCopy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      showToast("Copied — paste it into your message.");
    } catch (e) {
      showToast("Couldn't copy automatically — select the text manually.");
    }
  }

  function buildMessage() {
    var title = els.occasionInput.value.trim() || "Roster";
    var description = els.descInput.value.trim();
    var lines = [title];
    if (description) { lines.push(""); lines.push(description); }
    lines.push("");
    ROLE_ZONES.forEach(function (r) {
      var names = people.filter(function (p) { return p.assignment === r.key; }).map(function (p) { return p.name; });
      lines.push(r.label + ": " + (names.length ? names.join(", ") : "TBC") + ".");
    });
    return lines.join("\n");
  }

  /* ---------- people / drag-drop ---------- */

  function addPerson() {
    var name = els.newPersonName.value.trim();
    if (!name) { showToast("Type a name first."); return; }
    var color = SWATCHES[Math.floor(Math.random() * SWATCHES.length)];
    people.push({ id: "p" + (nextId++), name: name, color: color, assignment: "pool" });
    els.newPersonName.value = "";
    renderPeople();
  }
  els.addPersonBtn.addEventListener("click", addPerson);
  els.newPersonName.addEventListener("keydown", function (e) { if (e.key === "Enter") addPerson(); });

  function assignPerson(id, zoneKey) {
    var person = people.find(function (p) { return p.id === id; });
    if (person) person.assignment = zoneKey;
    renderPeople();
  }

  function removePerson(id) {
    people = people.filter(function (p) { return p.id !== id; });
    renderPeople();
  }

  var ROLE_KEY_MAP = { "1": "sound", "2": "lx", "3": "p", "4": "op", "0": "pool", "Backspace": "pool" };

  function buildChip(person) {
    var chip = document.createElement("div");
    chip.className = "chip";
    chip.tabIndex = 0;
    chip.setAttribute("role", "button");
    chip.setAttribute("aria-label", person.name + " — press 1 Sound, 2 Lx, 3 P, 4 Op, 0 to unassign");

    var swatch = document.createElement("span");
    swatch.className = "swatch";
    swatch.style.background = person.color || "#8a4b2f";
    swatch.textContent = initials(person.name);

    var name = document.createElement("span");
    name.className = "name";
    name.textContent = person.name;

    var inPool = !person.assignment || person.assignment === "pool";
    var x = document.createElement("button");
    x.type = "button";
    x.className = "x";
    x.title = inPool ? "Remove " + person.name + " from the crew" : "Send " + person.name + " back to People";
    x.textContent = "×";
    // Stop the pointerdown here from ever reaching the chip's own
    // pointerdown listener below — otherwise it starts a drag and calls
    // preventDefault(), which suppresses the click this button needs.
    x.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
    x.addEventListener("click", function (e) {
      e.stopPropagation();
      if (inPool) {
        removePerson(person.id);
      } else {
        assignPerson(person.id, "pool");
      }
    });

    chip.appendChild(swatch);
    chip.appendChild(name);
    chip.appendChild(x);

    chip.addEventListener("keydown", function (e) {
      var zone = ROLE_KEY_MAP[e.key];
      if (zone) {
        e.preventDefault();
        assignPerson(person.id, zone);
      }
    });

    chip.addEventListener("pointerdown", function (e) {
      if (e.button !== 0 && e.pointerType === "mouse") return;
      startDrag(person, chip, e);
    });

    return chip;
  }

  function startDrag(person, originEl, downEvent) {
    downEvent.preventDefault();
    var rect = originEl.getBoundingClientRect();
    var ghost = originEl.cloneNode(true);
    ghost.classList.add("drag-ghost");
    ghost.style.width = rect.width + "px";
    document.body.appendChild(ghost);
    originEl.classList.add("dragging");

    // On touch, a fingertip covers the chip and whatever's under it — lift
    // the ghost above the touch point so the drop zones stay visible.
    var yOffset = downEvent.pointerType === "touch" ? -64 : 0;
    positionGhost(downEvent.clientX, downEvent.clientY);

    var currentZoneEl = null;

    function positionGhost(x, y) {
      ghost.style.left = x + "px";
      ghost.style.top = (y + yOffset) + "px";
      ghost.style.transform = "translate(-50%, -50%)";
    }

    function zoneElAt(x, y) {
      ghost.style.display = "none";
      var el = document.elementFromPoint(x, y);
      ghost.style.display = "";
      return el ? el.closest("[data-zone]") : null;
    }

    function onMove(e) {
      positionGhost(e.clientX, e.clientY);
      var zone = zoneElAt(e.clientX, e.clientY);
      if (zone !== currentZoneEl) {
        if (currentZoneEl) currentZoneEl.classList.remove("dragover");
        if (zone) zone.classList.add("dragover");
        currentZoneEl = zone;
      }
    }

    function onUp(e) {
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
      originEl.classList.remove("dragging");
      ghost.remove();
      if (currentZoneEl) currentZoneEl.classList.remove("dragover");
      var zone = zoneElAt(e.clientX, e.clientY);
      if (zone) assignPerson(person.id, zone.getAttribute("data-zone"));
    }

    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  }

  function renderPeople() {
    els.poolZone.innerHTML = "";
    ROLE_ZONES.forEach(function (r) { zoneEls[r.key].list.innerHTML = ""; });

    var pool = people.filter(function (p) { return !p.assignment || p.assignment === "pool"; });
    if (!pool.length) {
      var ph = document.createElement("span");
      ph.className = "role-empty";
      ph.textContent = "Add names above — drag them into a role below.";
      els.poolZone.appendChild(ph);
    } else {
      pool.forEach(function (p) { els.poolZone.appendChild(buildChip(p)); });
    }

    ROLE_ZONES.forEach(function (r) {
      var assigned = people.filter(function (p) { return p.assignment === r.key; });
      var list = zoneEls[r.key].list;
      if (!assigned.length) {
        var e = document.createElement("span");
        e.className = "role-empty";
        e.textContent = "Empty";
        list.appendChild(e);
      } else {
        assigned.forEach(function (p) { list.appendChild(buildChip(p)); });
      }
    });
  }

  function buildRoleZones() {
    ROLE_ZONES.forEach(function (r) {
      var zone = document.createElement("div");
      zone.className = "role-zone";
      zone.setAttribute("data-zone", r.key);

      var h = document.createElement("h3");
      h.textContent = r.label;
      zone.appendChild(h);

      var list = document.createElement("div");
      list.style.display = "flex";
      list.style.flexWrap = "wrap";
      list.style.gap = "6px";
      zone.appendChild(list);

      els.rolesGrid.appendChild(zone);
      zoneEls[r.key] = { root: zone, list: list };
    });
    els.poolZone.setAttribute("data-zone", "pool");
  }

  /* ---------- copy ---------- */

  els.copyBtn.addEventListener("click", function () { copyText(buildMessage()); });

  /* ---------- init ---------- */

  buildRoleZones();
  renderPeople();
</script>

</body>
</html>
